name: Prodamus checkout and webhook regression tests

on:
  push:
    branches: [main]
    paths:
      - "backend/prodamus.js"
      - "backend/billing.js"
      - "backend/creditsBilling.js"
      - "backend/paymentCreationIdempotency.js"
      - "backend/test/prodamus-webhook.test.js"
      - "backend/test/payment-creation-settlement.test.js"
      - "backend/test/prodamus-ambiguous-checkout.test.js"
      - "backend/test/billing-security-contract.test.js"
      - ".github/workflows/prodamus-checkout-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/prodamus.js"
      - "backend/billing.js"
      - "backend/creditsBilling.js"
      - "backend/paymentCreationIdempotency.js"
      - "backend/test/prodamus-webhook.test.js"
      - "backend/test/payment-creation-settlement.test.js"
      - ".github/workflows/prodamus-checkout-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Test Prodamus checkout encoding, signatures and webhook validation
        run: node --test test/prodamus-webhook.test.js test/payment-creation-settlement.test.js test/prodamus-ambiguous-checkout.test.js test/billing-security-contract.test.js
      - name: Test checkout idempotency and ambiguous provider failures
        run: node --test test/payment-creation-settlement.test.js
