name: Persisted boards integration checks

on:
  workflow_dispatch:
  push:
    branches:
      # Every branch that work actually lands on. The previous list covered only
      # feat/persisted-boards-api, so a broken build on any other branch or PR
      # reached the shared branch unnoticed.
      - main
      - feat/persisted-boards-api
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches:
      - main
      - feat/persisted-boards-api
      - fix/atomic-payment-fulfillment
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check index.js
      - run: node --check analyze.js
      - run: node --check boards.js
      - run: node --check textOutputValidation.js
      - run: node --test test/text-output-validation.test.js
      - run: npm test
      - run: node ../test/e2e-email-verify.js
