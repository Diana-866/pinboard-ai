name: Prodamus webhook tests

on:
  push:
    branches:
      - fix/prodamus-webhook-format
      - fix/atomic-payment-fulfillment
      - feat/persisted-boards-api
  pull_request:
    branches:
      - main
      - fix/atomic-payment-fulfillment

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend regression tests
        run: npm test
