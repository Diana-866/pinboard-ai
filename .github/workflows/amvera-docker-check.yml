name: Amvera Docker build check

on:
  push:
    branches:
      - infra/postgresql-s3-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull -t pinposy-backend:ci .
