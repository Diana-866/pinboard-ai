name: Atomic payment fulfillment integration

on:
  workflow_dispatch:
  push:
    branches:
      - fix/atomic-payment-fulfillment
  pull_request:
    branches:
      - main
      - fix/atomic-payment-fulfillment

permissions:
  contents: read

jobs:
  postgres-atomicity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pinposy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pinposy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare disposable schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create table public.users (
            id uuid primary key default gen_random_uuid(),
            email text not null,
            password_hash text,
            email_verified boolean not null default false,
            credits_balance integer not null default 0,
            tariff_plan text not null default 'none',
            tariff_period_end timestamptz
          );
          create table public.auth_tokens (
            id uuid primary key default gen_random_uuid(),
            user_id text not null,
            token_hash text not null unique,
            purpose text not null default 'password_reset',
            expires_at timestamptz not null,
            used_at timestamptz,
            created_at timestamptz default now()
          );
          create table public.projects (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null references public.users(id),
            niche text,
            tone text,
            language text
          );
          create table public.boards (
            id uuid primary key default gen_random_uuid(),
            project_id uuid not null references public.projects(id),
            title text,
            description text,
            status text
          );
          create table public.pins (
            id uuid primary key default gen_random_uuid(),
            board_id uuid not null references public.boards(id),
            image_url text,
            title text,
            description text,
            status text default 'pending',
            model_used text,
            credits_cost numeric,
            scheduled_date date,
            aspect_ratio text default '2:3',
            created_at timestamp without time zone default now()
          );
          create table public.pinterest_accounts (
            id uuid primary key default gen_random_uuid(),
            user_id text not null,
            pinterest_user_id text,
            username text,
            access_token text not null,
            refresh_token text,
            scopes text,
            expires_at timestamptz,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          create unique index uniq_pinterest_accounts_user on public.pinterest_accounts(user_id);
          create table public.pinterest_publications (
            id uuid primary key default gen_random_uuid(),
            user_id text not null,
            pin_id uuid not null,
            pinterest_pin_id text not null,
            pinterest_board_id text not null,
            created_at timestamptz not null default now()
          );
          create unique index uniq_pinterest_publications_pin on public.pinterest_publications(pin_id);
          create unique index uniq_pinterest_publications_remote on public.pinterest_publications(pinterest_pin_id);
          create table public.credit_transactions (
            id uuid primary key default gen_random_uuid(),
            user_id text,
            amount numeric,
            type text,
            description text,
            created_at timestamptz default now()
          );
          create table public.credit_purchases (
            id uuid primary key default gen_random_uuid(),
            user_id text not null,
            package_id text not null,
            pack_title text,
            credits integer not null,
            status text not null default 'pending',
            provider_payment_id text,
            amount numeric not null default 0,
            currency text not null default 'rub',
            paid_at timestamptz,
            balance_credited_at timestamptz,
            created_at timestamptz not null default now()
          );
          create table public.subscriptions (
            id uuid primary key default gen_random_uuid(),
            user_id text not null,
            plan text not null,
            status text not null default 'pending',
            provider_payment_id text,
            amount numeric not null default 0,
            currency text not null default 'rub',
            period_start timestamptz,
            period_end timestamptz,
            created_at timestamptz not null default now()
          );
          -- Minimal baseline helper fixture: migration 041 hardens its function config.
          create or replace function public.adjust_credits_balance(p_user_id text, p_amount integer)
          returns integer
          language plpgsql
          security definer
          set search_path = public
          as $fixture$
          declare
            v_new_balance integer;
          begin
            if p_user_id is null or p_amount is null then
              raise exception 'p_user_id and p_amount are required';
            end if;
            update public.users
               set credits_balance = credits_balance + p_amount
             where id::text = p_user_id
               and (p_amount >= 0 or credits_balance + p_amount >= 0)
             returning credits_balance into v_new_balance;
            if not found then
              if exists (select 1 from public.users where id::text = p_user_id) then
                raise exception 'insufficient credits';
              end if;
              raise exception 'user not found: %', p_user_id;
            end if;
            return v_new_balance;
          end;
          $fixture$;
          revoke all on function public.adjust_credits_balance(text, integer)
            from public, anon, authenticated;
          grant execute on function public.adjust_credits_balance(text, integer)
            to service_role;
          SQL
      - name: Apply atomic migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/010_atomic_credit_ledger.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/011_atomic_subscription_activation.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/012_atomic_generation_charge.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/013_atomic_pin_regeneration.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/014_idempotent_pin_generation.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/015_persistent_pin_schedule.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/016_pinterest_publish_idempotency.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/017_pinterest_schedule_worker.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/018_preferred_language.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/019_prevent_late_subscription_downgrade.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/020_atomic_password_reset.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/021_atomic_email_verification.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/022_atomic_email_verification_issuance.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/023_revoke_sessions_after_password_reset.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/024_password_reset_email_cooldown.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/025_drop_legacy_password_reset_overload.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/026_pinterest_refresh_token_lease.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/027_pinterest_refresh_token_commit.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/028_pinterest_oauth_attempt_fencing.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/029_billing_webhook_exceptions.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/030_transactional_email_outbox.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/031_pinterest_account_scoped_foundation.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/032_pinterest_multi_account_oauth.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/033_pinterest_account_scoped_publication.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/034_pinterest_schedule_safe_retries.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/035_pinterest_schedule_manual_retry.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/036_pinterest_refresh_uncertainty_fence.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/037_billing_webhook_currency_audit.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/038_pinterest_oauth_manual_tariff_expiry.sql
          # Simulate permissive Supabase default grants so migration 039 proves it revokes them.
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -c "grant all on public.pinterest_accounts, public.pinterest_publications to anon, authenticated"
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/039_pinterest_sensitive_table_privileges.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/040_harden_security_definer_search_paths.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/041_harden_credit_balance_search_path.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/042_allow_admin_audit_reads.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/043_harden_schedule_claim_search_path.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/044_pin_generation_uncertainty_fence.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/045_pin_generation_task_journal.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/046_pin_generation_claim_fencing.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/047_pinterest_late_success_schedule_reconciliation.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/048_reconcile_historical_pinterest_unknown_schedules.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/049_pinterest_schedule_claim_fencing.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/050_pinterest_unified_safe_retry_policy.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/051_pinterest_schedule_content_snapshot.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/052_reconcile_legacy_pinterest_schedule_accounts.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/053_pin_regeneration_journal.sql
      - name: Verify Pinterest refresh uncertainty fence
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 <<'SQL'
          do $body$
          declare
            v_account_id uuid;
            v_state text;
          begin
            insert into public.pinterest_accounts(
              user_id, pinterest_user_id, username, access_token, refresh_token
            ) values (
              'refresh-fence-test', 'pinterest-refresh-fence-test', 'refresh-fence-test',
              'access-before', 'refresh-before'
            ) returning id into v_account_id;

            update public.pinterest_accounts
               set refresh_state = 'uncertain'
             where id = v_account_id;
            update public.pinterest_accounts
               set username = 'still-uncertain'
             where id = v_account_id;
            select refresh_state into v_state
              from public.pinterest_accounts where id = v_account_id;
            if v_state <> 'uncertain' then
              raise exception 'ordinary account update cleared refresh uncertainty';
            end if;

            update public.pinterest_accounts
               set access_token = 'access-after', refresh_token = 'refresh-after'
             where id = v_account_id;
            select refresh_state into v_state
              from public.pinterest_accounts where id = v_account_id;
            if v_state <> 'ready' then
              raise exception 'credential replacement did not clear refresh uncertainty';
            end if;
          end;
          $body$;
          SQL
      - name: Verify duplicate webhooks and ledger consistency
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f backend/test/pinterest-sensitive-table-privileges.integration.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f backend/test/security-definer-search-paths.integration.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f backend/test/billing-webhook-audit-privileges.integration.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f backend/test/postgres-integration.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f backend/test/pinterest-oauth.integration.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f backend/test/pinterest-account-foundation.integration.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f backend/test/pinterest-multi-account-oauth.integration.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f backend/test/pinterest-account-publication.integration.sql
          bash backend/test/subscription-concurrency.sh
          bash backend/test/credit-concurrency.sh
          bash backend/test/generation-concurrency.sh
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f backend/test/pin-regeneration-journal.integration.sql
