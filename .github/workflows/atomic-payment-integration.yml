name: Atomic payment fulfillment integration

on:
  workflow_dispatch:
  push:
    branches:
      - fix/atomic-payment-fulfillment
  pull_request:
    branches:
      - main
      - fix/atomic-payment-fulfillment

permissions:
  contents: read

jobs:
  postgres-atomicity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pinposy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pinposy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Test Pinterest account request retry policy
        run: node --test backend/test/pinterest-account-request.test.js
      - name: Test Pinterest board pagination
        run: node --test backend/test/pinterest-boards-pagination.test.js
      - name: Test pin image upload validation, errors, and rate-limit keys
        run: node --test backend/test/image-upload-validation.test.js backend/test/image-upload-errors.test.js backend/test/pin-image-rate-limit-key.test.js
      - name: Test managed pin image lifecycle
        run: node --test backend/test/pin-image-lifecycle.test.js
      - name: Test concurrent pin image replacement guard
        run: node --test backend/test/pin-image-compare-and-swap.test.js
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare disposable schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create table public.users (
            id uuid primary key default gen_random_uuid(),
            email text not null,
            password_hash text,
            email_verified boolean not null default false,
            credits_balance integer not null default 0,
            tariff_plan text not null default 'none',
            tariff_period_end timestamptz
          );
          create table public.auth_tokens (
            id uuid primary key default gen_random_uuid(),
            user_id text not null,
            token_hash text not null unique,
            purpose text not null default 'password_reset',
            expires_at timestamptz not null,
            used_at timestamptz,
            created_at timestamptz default now()
          );
          create table public.projects (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null references public.users(id),
            niche text,
            tone text,
            language text
          );
          create table public.boards (
            id uuid primary key default gen_random_uuid(),
            project_id uuid not null references public.projects(id),
            title text,
            description text,
            status text
          );
          create table public.pins (
            id uuid primary key default gen_random_uuid(),
            board_id uuid not null references public.boards(id),
            image_url text,
            title text,
            description text,
            status text default 'pending',
            model_used text,
            credits_cost numeric,
            scheduled_date date,
            aspect_ratio text default '2:3',
            created_at timestamp without time zone default now()
          );
          create table public.pinterest_accounts (
            id uuid primary key default gen_random_uuid(),
            user_id text not null,
            pinterest_user_id text,
            username text,
            access_token text not null,
            refresh_token text,
            scopes text,
            expires_at timestamptz,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          create unique index uniq_pinterest_accounts_user on public.pinterest_accounts(user_id);
          create table public.pinterest_publications (
            id uuid primary key default gen_random_uuid(),
            user_id text not null,
            pin_id uuid not null,
            pinterest_pin_id text not null,
            pinterest_board_id text not null,
            created_at timestamptz not null default now()
          );
          create unique index uniq_pinterest_publications_pin on public.pinterest_publications(pin_id);
          create unique index uniq_pinterest_publications_remote on public.pinterest_publications(pinterest_pin_id);
          create table public.credit_transactions (
            id uuid primary key default gen_random_uuid(),
            user_id text,
            amount numeric,
            type text,
            description text,
            created_at timestamptz default now()
          );
          create table public.credit_purchases (
            id uuid primary key default gen_random_uuid(),
            user_id text not null,
            package_id text not null,
            pack_title text,
            credits integer not null,
            status text not null default 'pending',
            provider_payment_id text,
            amount numeric not null default 0,
            currency text not null default 'rub',
            paid_at timestamptz,
            balance_credited_at timestamptz,
            created_at timestamptz not null default now()
          );
          create table public.subscriptions (
            id uuid primary key default gen_random_uuid(),
            user_id text not null,
            plan text not null,
            status text not null default 'pending',
            provider_payment_id text,
            amount numeric not null default 0,
            currency text not null default 'rub',
            period_start timestamptz,
            period_end timestamptz,
            created_at timestamptz not null default now()
          );
          -- Minimal baseline helper fixture: migration 041 hardens its function config.
          create or replace function public.adjust_credits_balance(p_user_id text, p_amount integer)
          returns integer
          language plpgsql
          security definer
          set search_path = public
          as $fixture$
          declare
            v_new_balance integer;
          begin
            if p_user_id is null or p_amount is null then
              raise exception 'p_user_id and p_amount are required';
            end if;
            update public.users
               set credits_balance = credits_balance + p_amount
             where id::text = p_user_id
               and (p_amount >= 0 or credits_balance + p_amount >= 0)
             returning credits_balance into v_new_balance;
            if not found then
              if exists (select 1 from public.users where id::text = p_user_id) then
                raise exception 'insufficient credits';
              end if;
              raise exception 'user not found: %', p_user_id;
            end if;
            return v_new_balance;
          end;
          $fixture$;
          revoke all on function public.adjust_credits_balance(text, integer)
            from public, anon, authenticated;
          grant execute on function public.adjust_credits_balance(text, integer)
            to service_role;
          SQL
