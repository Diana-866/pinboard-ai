name: Windows self-hosted verification

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/verify.ps1"
      - ".github/workflows/windows-self-hosted-verification.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/verify.ps1"
      - ".github/workflows/windows-self-hosted-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinposy-windows-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Never execute pull-request code from a fork on the owner's self-hosted machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Run backend and frontend verification
        shell: powershell
        run: .\scripts\verify.ps1
