name: PostgreSQL integration

on:
  workflow_dispatch:
  push:
    branches:
      - infra/postgresql-s3-migration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pinposy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pinposy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bootstrap Supabase-compatible roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT NULL::uuid $$;
          SQL
      - name: Apply baseline and hardening migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/001_baseline.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/009_hardening.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/010_atomic_credit_ledger.sql
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f db/migrations/011_atomic_subscription_activation.sql
      - name: Verify atomic credit and subscription operations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pinposy_test -v ON_ERROR_STOP=1 -f backend/test/postgres-integration.sql
